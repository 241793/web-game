<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>热血风格足球 · NEKKETSU-STYLE SOCCER</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: "Courier New", "SimHei", monospace; user-select: none; -webkit-user-select: none; touch-action: none; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #ui-root { position: absolute; inset: 0; pointer-events: none; }
    #ui-root > * { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="ui-root"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
